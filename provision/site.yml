---
# Local provisioning: core CLI packages + chezmoi init/apply.
# Scope: git, fish, neovim, wezterm, atuin, ripgrep, fd, keepassxc, syncthing.
# IDEs/docker/runtimes stay manual (Sync/configs/install/*.install).
#
#   ansible-playbook provision/site.yml --ask-become-pass [-e profile=work]
- name: Provision workstation (core CLI)
  hosts: localhost
  connection: local
  vars:
    profile_resolved: "{{ profile | default('personal') }}"
  vars_files:
    - vars/packages.yml
    - "vars/{{ profile_resolved }}.yml"

  tasks:
    - name: Install core packages (Arch)
      become: true
      community.general.pacman:
        name: "{{ packages_arch }}"
        state: present
      when: ansible_facts["os_family"] == "Archlinux"

    - name: Install core packages (Debian)
      become: true
      ansible.builtin.apt:
        name: "{{ packages_debian }}"
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"
      # note: wezterm + atuin are not in Debian repos — install upstream
      # (wezterm apt repo, atuin install script) manually for now

    - name: Install chezmoi (Debian, into ~/.local/bin)
      become: false
      ansible.builtin.shell: |
        sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      args:
        creates: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/bin/chezmoi"
      when: ansible_facts["os_family"] == "Debian"

    - name: Set login shell to fish
      become: true
      ansible.builtin.user:
        name: "{{ lookup('ansible.builtin.env', 'USER') }}"
        shell: /usr/bin/fish

    - name: Enable syncthing user service
      become: false
      ansible.builtin.systemd:
        name: syncthing
        scope: user
        enabled: true
      ignore_errors: true # headless/dbus-less runs

    - name: Init chezmoi with this repo as source (first run only)
      become: false
      ansible.builtin.command:
        argv:
          - chezmoi
          - init
          - --source
          - "{{ playbook_dir }}/.."
          - --promptString
          - "email={{ git_email }},name={{ git_name }}"
          - --promptBool
          - "hasLocalLLM={{ has_local_llm | lower }},useKeePassXC={{ use_keepassxc | lower }}"
      args:
        # chezmoi.toml only exists after first init
        # answers to the template prompts come from vars/<profile>.yml
        creates: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/chezmoi/chezmoi.toml"

    - name: Apply dotfiles
      become: false
      ansible.builtin.command: chezmoi apply
