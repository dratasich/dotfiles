# kitty config, mirroring ~/.config/wezterm/wezterm.lua
# (kitty native: TERM=xterm-kitty, undercurl, kitty keyboard protocol)

# geometry (wezterm initial_cols/rows)
initial_window_width 120c
initial_window_height 30c

# font
font_family JetBrains Mono
font_size 12

# colors: Solarized Dark (Gogh)
background #002b36
foreground #839496
cursor #839496
selection_background #073642
color0 #073642
color1 #dc322f
color2 #859900
color3 #b58900
color4 #268bd2
color5 #d33682
color6 #2aa198
color7 #eee8d5
color8 #002b36
color9 #cb4b16
color10 #586e75
color11 #657b83
color12 #839496
color13 #6c71c4
color14 #93a1a1
color15 #fdf6e3

# transparency (wezterm window_background_opacity)
background_opacity 0.95

# zen mode (wezterm window_decorations = NONE)
hide_window_decorations yes

# no padding (wezterm window_padding)
window_padding_width 0

# scroll by lines (wezterm ScrollByLine(3))
wheel_scroll_multiplier 3

# keybindings
map f11 toggle_fullscreen

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# tab bar: tmux-ish powerline on top
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_title_template " {index}:{title} "
tab_bar_min_tabs 1
active_tab_foreground #002b36
active_tab_background #b58900
inactive_tab_foreground #586e75
inactive_tab_background #073642
